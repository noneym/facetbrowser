name: Release

# Push a tag like v0.1.1 and this builds the Windows installer + portable exe
# and the macOS disk images, publishes them as a GitHub Release and uploads
# them to facetbrowser.com.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      FACET_ADMIN_TOKEN: ${{ secrets.FACET_ADMIN_TOKEN }}
      # Origin host: uploads go around Cloudflare, whose proxy caps request bodies at 100 MB.
      FACET_UPLOAD_ORIGIN: https://facetbrowser-web-facetbrowser.epyc-ana-ser-womi.dockerxo.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Set package version
        shell: bash
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --win --x64 --publish never

      - name: List artifacts
        shell: bash
        run: ls -la release/*.exe

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FacetBrowser ${{ steps.ver.outputs.tag }}
          files: |
            release/FacetBrowser-Setup-*.exe
            release/FacetBrowser-*-portable.exe
            release/latest.yml
          generate_release_notes: true

      - name: Upload to facetbrowser.com
        if: ${{ env.FACET_ADMIN_TOKEN != '' }}
        shell: bash
        run: |
          for f in release/FacetBrowser-Setup-*.exe release/FacetBrowser-*-portable.exe release/latest.yml; do
            name=$(basename "$f")
            echo "uploading $name"
            curl --fail -sS -T "$f" -H "x-admin-token: $FACET_ADMIN_TOKEN" "$FACET_UPLOAD_ORIGIN/api/admin/releases/$name"
            echo
          done

  macos:
    runs-on: macos-latest
    needs: windows
    env:
      FACET_ADMIN_TOKEN: ${{ secrets.FACET_ADMIN_TOKEN }}
      # Origin host: uploads go around Cloudflare, whose proxy caps request bodies at 100 MB.
      FACET_UPLOAD_ORIGIN: https://facetbrowser-web-facetbrowser.epyc-ana-ser-womi.dockerxo.dev
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Set package version
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Package (dmg, Apple Silicon)
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: List artifacts
        run: ls -la release/*.dmg

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FacetBrowser ${{ steps.ver.outputs.tag }}
          files: |
            release/FacetBrowser-*-mac-*.dmg

      - name: Upload to facetbrowser.com
        if: ${{ env.FACET_ADMIN_TOKEN != '' }}
        run: |
          for f in release/FacetBrowser-*-mac-*.dmg; do
            name=$(basename "$f")
            echo "uploading $name"
            curl --fail -sS -T "$f" -H "x-admin-token: $FACET_ADMIN_TOKEN" "$FACET_UPLOAD_ORIGIN/api/admin/releases/$name"
            echo
          done
